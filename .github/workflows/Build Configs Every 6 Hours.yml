name: Build Configs Every 6 Hours

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || echo "No dependencies"

      - name: Run builder
        run: node index.js
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO: ${{ secrets.PUBLIC_REPO }}

      - name: Commit cache/state (not outputs — those are pushed to PUBLIC_REPO by index.js)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update geo cache & history"
          branch: ${{ github.head_ref || github.ref_name }}
          file_pattern: '.state/*'
          commit_user_name: "GitHub Actions"
          commit_user_email: "actions@github.com"
